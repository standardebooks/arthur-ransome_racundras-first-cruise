		<section id="preface" epub:type="preface">
			<h2 epub:type="title">Author’s Note</h2>
			<p>More than once in the log of <i epub:type="se:name.vessel.ship">Racundra</i>'s little voyage I have mentioned that I found changes made by the war unrecorded in the obtainable charts. I have just received from the Esthonian Admiralty, through Mr. Edward Wirgo, a set of charts they have recently issued which cover the whole of the delightful cruising ground among the islands, and should certainly be obtained by the skippers of any other little ships who think of visiting these waters.</p>
